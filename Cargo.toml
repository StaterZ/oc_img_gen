[package]
name = "oc_img_gen"
version = "0.6.0"
edition = "2024"
authors = ["StaterZ"]

[dependencies]
#custom
szu = { version = "0.2.2", git = "https://github.com/StaterZ/szu-rs", branch = "master" }

#cli & user feedback
clap = { version = "4.6.7", features= ["derive"] }
humantime = "2.4.0"
charts-rs = { version = "2.3.0", optional = true }
indicatif = "0.18.6"
# tracing-indicatif = "0.3.13"
# tracing = "0.1.41"
# tracing-core = "0.1.34"
# tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

#error handling
anyhow = "1.0.104"
thiserror = "2.0.21"
all_asserts = "2.3.4"

#loading
ffmpeg-next = { version = "9.0.0", features = ["software-resampling"] }
ffmpeg-sys-next = "9.0.1"
lodepng = "3.12.2"

#fourier
realfft = "3.5.0"

#player
minifb = "0.29.0"
cpal = "0.18.2"
triple_buffer = "9.0.0"
display-info = "0.5.10"

#utilities
itertools = "0.15.0"
deku = "0.20.3"
deku_string = { version = "0.4.1-0", git = "https://github.com/eirtools/deku_string", branch = "renovate/deku-0.x" }
enum-as-inner = "0.7.0"
phf = { version = "0.14.0", features = ["macros"] }
lapjv = "0.3.0"
num = "0.4.3"
rayon = { version = "1.12.0", optional = true }
integer-sqrt = "0.1.5"
palette = "0.7.7"
image = "0.25.10"
grid = "1.0.1"
ordered-float = "5.5.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
]}

[features]
default = ["rayon"]
log = []
rayon = ["dep:rayon"]
charts = ["dep:charts-rs"]
# gpu = ["wgpu", "bytemuck", "futures", "futures-intrusive"]


# https://stackoverflow.com/questions/60751806/how-to-compile-some-dependencies-with-release
[profile.dev.package."*"]
opt-level = 3

# [profile.dev]
# opt-level = 3

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true

[lints.cargo]
non_kebab_case_bins = "allow"
